<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer gold rim accent -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />

  <!-- Bread Loaf Illustration -->
  <g transform="translate(256, 230)">
    <!-- Steam / Warmth Lines -->
    <path d="M-60 -110 Q-70 -140 -50 -160" stroke="#fef08a" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M0 -120 Q-10 -150 10 -175" stroke="#fef08a" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M60 -110 Q50 -140 70 -160" stroke="#fef08a" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Main Loaf Base -->
    <ellipse cx="0" cy="0" rx="160" ry="90" fill="url(#goldGrad)" filter="drop-shadow(0 15px 12px rgba(0,0,0,0.4))" />
    <path d="M-150,0 C-150,70 150,70 150,0 C150,-65 -150,-65 -150,0 Z" fill="#b45309" opacity="0.3"/>

    <!-- Bread Score Marks (Cortes Tradicionais do Pão Francês/Doce) -->
    <path d="M-90 -35 Q-70 0 -90 35" stroke="#78350f" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M-30 -45 Q-10 0 -30 45" stroke="#78350f" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M30 -45 Q50 0 30 45" stroke="#78350f" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M90 -35 Q110 0 90 35" stroke="#78350f" stroke-width="12" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography -->
  <text x="256" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="2">PANIFICADORA</text>
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#fbbf24" letter-spacing="4">MORUMBI</text>
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#fecaca" letter-spacing="3">SISTEMA DE REVENDA</text>
</svg>
